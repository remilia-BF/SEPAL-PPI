all_feature_folder: mutifeature/Strings_plant50
change_embedding_dim: 1280
data:
  cache_size: 15000
  cis_type: false
  embedding_dim: 1280
  embedding_file: emb/Strings_plant50/esm2_15b.Strings_plant50.avg.1280.lmdb/noCLSeos.lmdb/bucketed_embeddings.lmdb
  fasta_file: dataset/Strings_plant50/protein.fasta
  max_length: 1000
  target_precision: bf16
  test_file: dataset/Strings_plant50/c3Test.txt
  train_file: dataset/Strings_plant50/c1Train.txt
  use_sequence_data: true
  validation_file: dataset/Strings_plant50/c2Test.txt
experiment_name: sepal-ppi-feature-contant
inference:
  batch_size: 32
  best_epoch: 1
  threshold: 0.5
logging:
  level: INFO
  verbose: true
model:
  embedding_dim: 1280
  model_config:
    input_data:
      description: projector(hidden_2560)
      embedding_dim: 1280
      input_dim: 1280
      projection:
        activation: gelu
        bias: true
        dropout: 0.0
        enabled: true
        hidden_dim: 2560
        layernorm: true
        residual: true
        type: mlp
      separate_save_models: true
    learning_architecture:
      activation: GELU
      description: 四层MLP进行二分类
      dropout: 0.0
      input_dim: 1280
      layers:
      - 1024
      - 512
      - 128
      - 16
      output_activation: sigmoid
      type: MLP
    output:
      num_classes: 1
      output_activation: none
      threshold: 0.5
    pooling:
      attention_config:
        residual_connection: false
        temperature: 0.3
        type: temperature_original
        use_layer_norm: false
      attention_num: 2
      description: 优化的注意力池化：多头注意力 + 更强正则化
      dropout: 0.05
      embedding_dim: 1280
      method: attention_pooling
      save_attention: true
    post_pooling:
      description: 对两个池化后的蛋白向量进行元素级的哈达玛积
      embedding_dim: 1280
      operation: hadamard_product
    preprocessing:
      data_processing:
        all_feature_folder: mutifeature/Strings_plant50
        cache_features: true
        embedding_compression:
          linear: null
          method: mlp
          mlp:
            activation: gelu
            dropout: 0.1
        feature_encoder:
          activation: gelu
          dropout: 0.1
          kernel_size: 3
        handle_missing: zero
        log_missing_as_error: false
        normalization_method: z_score
        protein_fasta_path: dataset/Strings_plant50/protein.fasta
      description: 【极致轻量化版本】移除Transformer，使用1D-CNN + 提前降维(8维) + 全局门控
      embedding:
        dropout: 0.1
        padding_idx: null
        pfam_emb_dim: 8
        prosst_emb_dim: 2048
        protein_length_emb_dim: 8
        total_feature_emb_dim: 64
      embedding_dim: 1280
      feature_files:
        hmm_binding_domain_flag:
          enabled: true
          file_path: hmm_binding_domain_flag.json
          normalize: false
          raw_dim: 1
        hmm_boundary_site_flag:
          enabled: true
          file_path: hmm_boundary_site_flag.json
          normalize: false
          raw_dim: 1
        hmm_confidence_score:
          enabled: true
          file_path: hmm_confidence_score.json
          normalize: true
          raw_dim: 1
        hmm_core_site_flag:
          enabled: true
          file_path: hmm_core_site_flag.json
          normalize: false
          raw_dim: 1
        hmm_domain_flag:
          enabled: true
          file_path: hmm_domain_flag.json
          normalize: false
          raw_dim: 1
        hmm_emission_prob:
          enabled: true
          file_path: hmm_emission_prob.json
          normalize: true
          raw_dim: 1
        hmm_pfam_id:
          compression_dim: 256
          embedding_dim: 256
          enabled: false
          feature_dim: 8
          feature_type: embedding
          file_path: hmm_pfam_id.json
          normalize: false
          vocab_size: 24737
        hydrophobicity_features:
          enabled: false
          file_path: hydrophobicity_features.json
          normalize: true
          raw_dim: 1
        pqr_feature:
          enabled: false
          file_path: pqr_feature.json
          normalize: true
          raw_dim: 1
        protein_length:
          embedding_dim: 128
          enabled: false
          feature_dim: 8
          feature_type: embedding
          normalize: false
          vocab_size: 5000
        s1ssttoken:
          compression_dim: 128
          embedding_dim: 2048
          enabled: true
          feature_dim: 2048
          feature_type: embedding
          file_path: prosst_features.json
          normalize: false
          vocab_size: 2048
        sasa_features:
          enabled: true
          file_path: sasa_features.json
          normalize: true
          raw_dim: 1
        secondary_structure_features:
          enabled: true
          file_path: secondary_structure_features.json
          normalize: false
          raw_dim: 3
      feature_gating:
        activation: GELU
        dropout: 0.1
        enabled: true
        hidden_dim: 64
        sparsity_loss_weight: 0.01
      fusion_mlp: null
      preprocessor: feature_concat
      projection:
        activation: GELU
        dropout: 0.1
        early_compression_dim: 8
        hidden_layers: []
        output_dim: 128
        use_low_rank_final: true
        use_multiplicative_residual: false
      resnet:
        activation: GELU
        dropout: 0.1
        kernel_size: 3
        num_blocks: 1
  model_unit:
    input_data:
      description: projector(hidden_2560)
      embedding_dim: 1280
      input_dim: 1280
      projection:
        activation: gelu
        bias: true
        dropout: 0.0
        enabled: true
        hidden_dim: 2560
        layernorm: true
        residual: true
        type: mlp
      separate_save_models: true
    learning_architecture:
      activation: GELU
      description: 四层MLP进行二分类
      dropout: 0.0
      input_dim: 1280
      layers:
      - 1024
      - 512
      - 128
      - 16
      output_activation: sigmoid
      type: MLP
    output:
      num_classes: 1
      output_activation: none
      threshold: 0.5
    pooling:
      attention_config:
        residual_connection: false
        temperature: 0.3
        type: temperature_original
        use_layer_norm: false
      attention_num: 2
      description: 优化的注意力池化：多头注意力 + 更强正则化
      dropout: 0.05
      embedding_dim: 1280
      method: attention_pooling
      save_attention: true
    post_pooling:
      description: 对两个池化后的蛋白向量进行元素级的哈达玛积
      embedding_dim: 1280
      operation: hadamard_product
    preprocessing:
      data_processing:
        all_feature_folder: mutifeature/Strings_plant50
        cache_features: true
        embedding_compression:
          linear: null
          method: mlp
          mlp:
            activation: gelu
            dropout: 0.1
        feature_encoder:
          activation: gelu
          dropout: 0.1
          kernel_size: 3
        handle_missing: zero
        log_missing_as_error: false
        normalization_method: z_score
        protein_fasta_path: dataset/Strings_plant50/protein.fasta
      description: 【极致轻量化版本】移除Transformer，使用1D-CNN + 提前降维(8维) + 全局门控
      embedding:
        dropout: 0.1
        padding_idx: null
        pfam_emb_dim: 8
        prosst_emb_dim: 2048
        protein_length_emb_dim: 8
        total_feature_emb_dim: 64
      embedding_dim: 1280
      feature_files:
        hmm_binding_domain_flag:
          enabled: true
          file_path: hmm_binding_domain_flag.json
          normalize: false
          raw_dim: 1
        hmm_boundary_site_flag:
          enabled: true
          file_path: hmm_boundary_site_flag.json
          normalize: false
          raw_dim: 1
        hmm_confidence_score:
          enabled: true
          file_path: hmm_confidence_score.json
          normalize: true
          raw_dim: 1
        hmm_core_site_flag:
          enabled: true
          file_path: hmm_core_site_flag.json
          normalize: false
          raw_dim: 1
        hmm_domain_flag:
          enabled: true
          file_path: hmm_domain_flag.json
          normalize: false
