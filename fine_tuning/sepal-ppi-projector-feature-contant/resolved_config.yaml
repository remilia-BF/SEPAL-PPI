        activation: GELU
        dropout: 0.1
        early_compression_dim: 8
        hidden_layers: []
        output_dim: 128
        use_low_rank_final: true
        use_multiplicative_residual: false
      resnet:
        activation: GELU
        dropout: 0.1
        kernel_size: 3
        num_blocks: 1
output:
  output_dir: outputs/
  save_model: true
  save_predictions: true
protein_fasta_path: dataset/Strings_plant50/protein.fasta
training:
  batch_size: 128
  epochs: 25
  gradient_accumulation:
    enabled: true
    steps: 4
  learning_rate: 0.0001
  lr_scheduler:
    type: none
    warmup:
      enabled: true
      epochs: 3
      initial_lr_factor: 0.1
      strategy: exponential
  optimizer:
    betas:
    - 0.9
    - 0.999
    type: adamw
    weight_decay: 0.01
  seed: 42
