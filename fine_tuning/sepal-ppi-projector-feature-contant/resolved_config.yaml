          enabled: false
          feature_dim: 8
          feature_type: embedding
          normalize: false
          vocab_size: 5000
        s1ssttoken:
          compression_dim: 128
          embedding_dim: 2048
          enabled: true
          feature_dim: 2048
          feature_type: embedding
          file_path: prosst_features.json
          normalize: false
          vocab_size: 2048
        sasa_features:
          enabled: true
          file_path: sasa_features.json
          normalize: true
          raw_dim: 1
        secondary_structure_features:
          enabled: true
          file_path: secondary_structure_features.json
          normalize: false
          raw_dim: 3
      feature_gating:
        activation: GELU
        dropout: 0.1
        enabled: true
        hidden_dim: 64
