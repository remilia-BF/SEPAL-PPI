[nsp3]
# conda executable name or absolute path
conda_executable = conda

# conda environment that contains NetSurfP-3.0 runtime deps
conda_env = nsp3

# python executable inside the conda env
python_executable = python

# absolute path to NetSurfP-3.0 standalone entry script
nsp3_script = /home/remilia/BFSW/NetSurfP-3.0_standalone/nsp3.py

# absolute path to NetSurfP-3.0 model weights
model_path = /home/remilia/BFSW/NetSurfP-3.0_standalone/models/nsp3.pth

# whether to pass "-gpu True" to nsp3.py
use_gpu = True

# output subfolder id under <output_dir>/tmp; can be overridden by --worker-id
worker_id = 01

# batch: one nsp3 process for whole FASTA; per_sequence: one process per sequence (recommended to avoid VRAM growth)
run_mode = per_sequence

# only used when run_mode = per_sequence
# number of sequences per nsp3 subprocess; lower is safer for VRAM, higher is faster
sequences_per_run = 1000
