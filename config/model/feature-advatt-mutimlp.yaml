defaults:
  - _self_
  - /model_unit/input_data: projector
  - /model_unit/preprocessing: feature_concat
  - /model_unit/pooling: advanced_attention_pooling
  - /model_unit/post_pooling: hadamard_product
  - /model_unit/learning_architecture: muti_MLP
  - /model_unit/output: logits

embedding_dim: ${change_embedding_dim}
attention_num: 8

model_config:
  input_data: ${..model_unit.input_data}
  preprocessing: ${..model_unit.preprocessing}
  pooling: ${..model_unit.pooling}
  post_pooling: ${..model_unit.post_pooling}
  learning_architecture: ${..model_unit.learning_architecture}
  output: ${..model_unit.output}

# 显式对齐多头配置，避免 pooling 与 muti_MLP head 不一致
model_unit:
  pooling:
    attention_num: ${attention_num}
  learning_architecture:
    head: ${attention_num}
